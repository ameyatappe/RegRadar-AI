[project]
name = "regradar-ai"
version = "0.1.0"
description = "AI-assisted regulatory change analysis and policy impact identification"
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies introduced in Milestone 2.
dependencies = ["rank-bm25>=0.2.2"]

[project.optional-dependencies]
# Install dev extras with:  py -m pip install -e ".[dev]"
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# Tell pytest where to look for tests and which Python files contain them.
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --tb has no direct ini key; pass it as a CLI flag via addopts instead.
addopts = "--tb=short"
